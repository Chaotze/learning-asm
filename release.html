<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上传到 GitLab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0c10;
      --surface: #111318;
      --surface-2: #161a22;
      --border: #232832;
      --border-hover: #2e3542;
      --text: #e6edf3;
      --text-dim: #8b949e;
      --text-faint: #484f58;
      --accent: #39d353;
      --accent-dim: #238636;
      --accent-glow: rgba(57, 211, 83, 0.15);
      --cyan: #49bc5c;
      --red: #f85149;
      --amber: #d29922;
      --radius: 8px;
      --radius-lg: 12px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      background-image:
        radial-gradient(circle at 50% 0%, rgba(57, 211, 83, 0.04) 0%, transparent 60%),
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      background-position: 0 0, 0 0, 0 0;
    }

    .harness {
      max-width: 1080px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.02), 0 20px 60px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .harness-bar {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.75rem 1.25rem;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }

    .harness-bar .dots {
      display: flex;
      gap: 0.4rem;
    }

    .harness-bar .dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--border-hover);
    }

    .harness-bar .dots span:first-child { background: #ff5f56; }
    .harness-bar .dots span:nth-child(2) { background: #ffbd2e; }
    .harness-bar .dots span:nth-child(3) { background: #27c93f; }

    .harness-bar .title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-left: 0.5rem;
      letter-spacing: 0.02em;
    }

    .harness-bar .title .path {
      color: var(--accent);
    }

    .harness-bar .status-dot {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    .harness-bar .status-dot::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .harness-body {
      padding: 1.75rem;
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .header-left h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .header-left h1 .prompt {
      color: var(--accent);
      font-weight: 700;
    }

    .header-left .desc {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 0.4rem;
      padding-left: 1.6rem;
    }

    .header-left .desc .k {
      color: var(--cyan);
    }

    .token-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.4rem 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      transition: border-color 0.2s;
    }

    .token-box:focus-within {
      border-color: var(--accent-dim);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .token-box .lock {
      color: var(--text-faint);
    }

    .token-box input {
      border: none;
      background: transparent;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      width: 180px;
      outline: none;
    }

    .token-box input::placeholder {
      color: var(--text-faint);
    }

    .dropzone {
      border: 1px dashed var(--border-hover);
      border-radius: var(--radius);
      padding: 2.2rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--bg);
      margin-bottom: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    .dropzone::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, var(--accent-glow) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .dropzone:hover {
      border-color: var(--accent-dim);
      background: var(--surface-2);
    }

    .dropzone.dragover {
      border-color: var(--accent);
      background: var(--surface-2);
      box-shadow: inset 0 0 30px var(--accent-glow);
    }

    .dropzone.dragover::before {
      opacity: 1;
    }

    .dropzone .dz-icon {
      font-size: 2.4rem;
      display: block;
      margin-bottom: 0.7rem;
      filter: grayscale(0.3);
      transition: transform 0.2s;
    }

    .dropzone.dragover .dz-icon {
      transform: scale(1.1) translateY(-2px);
    }

    .dropzone .dz-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 0.3rem;
    }

    .dropzone .dz-hint {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    .dropzone .dz-hint code {
      color: var(--accent);
      background: rgba(57, 211, 83, 0.08);
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
    }

    .file-panel {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 1.5rem;
      overflow: hidden;
      display: none;
    }

    .file-panel.visible {
      display: block;
    }

    .file-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 1rem;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    .file-panel-head .badge {
      background: var(--accent-dim);
      color: var(--text);
      border-radius: 4px;
      padding: 0.15rem 0.55rem;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .file-list {
      max-height: 180px;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .file-list::-webkit-scrollbar {
      width: 6px;
    }

    .file-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .file-list::-webkit-scrollbar-thumb {
      background: var(--border-hover);
      border-radius: 3px;
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.45rem 0.7rem;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      transition: background 0.15s;
    }

    .file-row:hover {
      background: var(--surface-2);
    }

    .file-row .fi {
      font-size: 0.9rem;
      width: 1.2rem;
      text-align: center;
    }

    .file-row .fname {
      flex: 1;
      color: var(--text);
      word-break: break-all;
    }

    .file-row .fsize {
      color: var(--text-faint);
      font-size: 0.7rem;
      white-space: nowrap;
    }

    .file-row .del {
      background: none;
      border: none;
      color: var(--text-faint);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0.1rem 0.3rem;
      border-radius: 4px;
      transition: all 0.15s;
      line-height: 1;
    }

    .file-row .del:hover {
      color: var(--red);
      background: rgba(248, 81, 73, 0.1);
    }

    .progress-panel {
      margin-bottom: 1.5rem;
      display: none;
    }

    .progress-panel.visible {
      display: block;
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
    }

    .progress-track {
      height: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-dim), var(--accent));
      border-radius: 3px;
      transition: width 0.3s ease;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .field label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .field label .opt {
      color: var(--text-faint);
      text-transform: none;
      font-size: 0.65rem;
    }

    .field input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem 0.85rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      color: var(--text);
      outline: none;
      transition: all 0.2s;
    }

    .field input:focus {
      border-color: var(--accent-dim);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .field input::placeholder {
      color: var(--text-faint);
    }

    .field input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding-top: 1.4rem;
    }

    .check-row input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: var(--accent);
      cursor: pointer;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 3px;
    }

    .check-row label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-dim);
      cursor: pointer;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      padding-top: 1.2rem;
      border-top: 1px solid var(--border);
    }

    .btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.65rem 1.4rem;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
      letter-spacing: 0.01em;
    }

    .btn-primary {
      background: var(--accent-dim);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(57, 211, 83, 0.2), 0 4px 12px rgba(57, 211, 83, 0.15);
    }

    .btn-primary:hover:not(:disabled) {
      background: #2ea043;
      box-shadow: 0 0 0 1px rgba(57, 211, 83, 0.3), 0 6px 18px rgba(57, 211, 83, 0.25);
      transform: translateY(-1px);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      background: var(--surface-2);
      color: var(--text-faint);
      border-color: var(--border);
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-dim);
      border-color: var(--border);
    }

    .btn-ghost:hover:not(:disabled) {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--border-hover);
    }

    .btn-ghost:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .size-info {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-faint);
      margin-left: auto;
    }

    .status {
      margin-top: 1.2rem;
      padding: 0.85rem 1rem;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-dim);
      word-break: break-word;
      line-height: 1.6;
    }

    .status .ico {
      flex-shrink: 0;
    }

    .status.success {
      border-color: rgba(57, 211, 83, 0.3);
      background: rgba(57, 211, 83, 0.06);
      color: #7ee787;
    }

    .status.error {
      border-color: rgba(248, 81, 73, 0.3);
      background: rgba(248, 81, 73, 0.06);
      color: #ff7b72;
    }

    .status.info {
      border-color: rgba(88, 166, 255, 0.3);
      background: rgba(88, 166, 255, 0.06);
      color: #79c0ff;
    }

    .footer {
      padding: 0.85rem 1.25rem;
      background: var(--surface-2);
      border-top: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--text-faint);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .footer .cmd {
      color: var(--text-dim);
    }

    .footer .cmd .flag {
      color: var(--cyan);
    }

    .spin {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: rotate 0.7s linear infinite;
      display: inline-block;
    }

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 640px) {
      .harness-body { padding: 1.25rem; }
      .header { flex-direction: column; }
      .token-box input { width: 130px; }
      .header-left h1 { font-size: 1.1rem; }
      .file-row .fsize { display: none; }
      .size-info { margin-left: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="harness">
    <div class="harness-bar">
      <div class="dots"><span></span><span></span><span></span></div>
      <span class="title">harness@learning-asm: <span class="path">~/gitlab-upload</span></span>
      <span class="status-dot">connected</span>
    </div>

    <div class="harness-body">
      <div class="header">
        <div class="header-left">
          <h1><span class="prompt">$</span> gitlab package upload</h1>
          <div class="desc">自动筛选目录下的 <span class="k">.EXE</span> 和 <span class="k">.OBJ</span> ，按文件名 <span class="k">倒序</span> 上传。包名默认取目录名。</div>
        </div>
        <div class="token-box">
          <span class="lock">🔑</span>
          <input type="password" id="tokenInput" value="glpat-xxxxxxxxxxxxxxxxxxxx" placeholder="GITLAB_TOKEN" spellcheck="false" aria-label="GitLab Token">
        </div>
      </div>

      <div class="dropzone" id="dropZone">
        <span class="dz-icon">📁</span>
        <div class="dz-title">拖拽文件夹至此，或点击选择</div>
        <div class="dz-hint">只扫描目录下的 <code>.EXE</code> 和 <code>.OBJ</code> · 按文件名 <code>倒序</code> 上传</div>
        <input type="file" id="folderInput" webkitdirectory directory multiple style="display: none;">
      </div>

      <div class="file-panel" id="filePanel">
        <div class="file-panel-head">
          <span>待上传文件</span>
          <span class="badge" id="fileBadge">0 个</span>
        </div>
        <div class="file-list" id="fileList"></div>
      </div>

      <div class="progress-panel" id="progressPanel">
        <div class="progress-head">
          <span>上传进度</span>
          <span id="progressText">0 / 0</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="form-grid">
        <div class="field">
          <label>GitLab 地址</label>
          <input type="url" id="gitlabUrl" value="https://git.tongji.edu.cn" placeholder="https://gitlab.com">
        </div>
        <div class="field">
          <label>项目 ID <span class="opt">(数字或 URL 编码)</span></label>
          <input type="text" id="projectId" value="1607" placeholder="1607 或 group%2Fproject">
        </div>
        <div class="field">
          <label>包名 <span class="opt">(默认文件夹名)</span></label>
          <input type="text" id="pkgName" placeholder="自动取文件夹名">
        </div>
        <div class="field">
          <label>版本号 <span class="opt">(CalVer)</span></label>
          <input type="text" id="pkgVersion" placeholder="2026.10.16">
        </div>
        <div class="field">
          <div class="check-row">
            <input type="checkbox" id="insecureCheck">
            <label for="insecureCheck">跳过 SSL 校验 (-k)</label>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="uploadBtn" disabled>
          <span>🚀</span> 上传全部
        </button>
        <button class="btn btn-ghost" id="selectFolderBtn">
          <span>📂</span> 选择文件夹
        </button>
        <button class="btn btn-ghost" id="resetBtn">
          <span>⟲</span> 重置
        </button>
        <span class="size-info" id="sizeInfo"></span>
      </div>

      <div class="status" id="statusMsg" style="display: none;">
        <span class="ico">ℹ️</span>
        <span class="txt">准备就绪</span>
      </div>
    </div>

    <div class="footer">
      <span class="cmd">$ <span class="flag">--project</span> &lt;id&gt; <span class="flag">--package</span> &lt;folder&gt; <span class="flag">--version</span> &lt;calver&gt; <span class="flag">--reverse</span></span>
      <span>harness v2026.10.16</span>
    </div>
  </div>

  <script>
    (function() {
      const dropZone = document.getElementById('dropZone');
      const folderInput = document.getElementById('folderInput');
      const filePanel = document.getElementById('filePanel');
      const fileList = document.getElementById('fileList');
      const fileBadge = document.getElementById('fileBadge');
      const progressPanel = document.getElementById('progressPanel');
      const progressFill = document.getElementById('progressFill');
      const progressText = document.getElementById('progressText');
      const sizeInfo = document.getElementById('sizeInfo');

      const gitlabUrlInput = document.getElementById('gitlabUrl');
      const projectIdInput = document.getElementById('projectId');
      const pkgNameInput = document.getElementById('pkgName');
      const pkgVersionInput = document.getElementById('pkgVersion');
      const insecureCheck = document.getElementById('insecureCheck');
      const tokenInput = document.getElementById('tokenInput');

      const uploadBtn = document.getElementById('uploadBtn');
      const selectFolderBtn = document.getElementById('selectFolderBtn');
      const resetBtn = document.getElementById('resetBtn');
      const statusMsg = document.getElementById('statusMsg');

      let allFiles = [];
      let folderName = '';
      let isUploading = false;

      // ---------- 工具 ----------
      function sanitizePkgName(raw) {
        if (!raw) return '';
        return raw.trim()
          .replace(/\s+/g, '-')
          .replace(/[^a-zA-Z0-9._-]/g, '');
      }

      function isAllCaps(name) {
        if (!name) return false;
        return /[A-Z]/.test(name) && !/[a-z]/.test(name);
      }

      function formatSize(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
      }

      function isTarget(name) {
        const l = name.toLowerCase();
        return l.endsWith('.exe') || l.endsWith('.obj');
      }

      // 字典序倒序比较（按文件名，忽略大小写更稳妥？脚本原逻辑是字典序，这里用 localeCompare 再取反）
      function compareDesc(a, b) {
        return b.baseName.localeCompare(a.baseName, 'en', { sensitivity: 'base' });
      }

      // ---------- 状态 ----------
      function setStatus(text, type = 'info', ico = 'ℹ️') {
        statusMsg.style.display = 'flex';
        statusMsg.className = 'status ' + type;
        statusMsg.querySelector('.ico').textContent = ico;
        statusMsg.querySelector('.txt').textContent = text;
      }

      function clearStatus() {
        statusMsg.style.display = 'none';
      }

      // ---------- 渲染 ----------
      function renderFileList() {
        if (allFiles.length === 0) {
          filePanel.classList.remove('visible');
          fileBadge.textContent = '0 个';
          sizeInfo.textContent = '';
          updateUploadBtn();
          return;
        }

        filePanel.classList.add('visible');
        fileBadge.textContent = allFiles.length + ' 个';

        const total = allFiles.reduce((a, f) => a + f.file.size, 0);
        sizeInfo.textContent = `总大小 ${formatSize(total)}`;

        fileList.innerHTML = allFiles.map((item, i) => {
          const icon = item.baseName.toLowerCase().endsWith('.exe') ? '⚙️' : '📦';
          return `<div class="file-row">
            <span class="fi">${icon}</span>
            <span class="fname">${item.baseName}</span>
            <span class="fsize">${formatSize(item.file.size)}</span>
            <button class="del" data-i="${i}" title="移除">✕</button>
          </div>`;
        }).join('');

        fileList.querySelectorAll('.del').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            if (isUploading) return;
            const i = parseInt(btn.dataset.i, 10);
            allFiles.splice(i, 1);
            if (allFiles.length === 0) {
              folderName = '';
              pkgNameInput.value = '';
            }
            renderFileList();
          });
        });

        updateUploadBtn();
      }

      // ---------- 默认参数 ----------
      function applyDefaults() {
        if (allFiles.length === 0) return;

        if (folderName) {
          const s = sanitizePkgName(folderName);
          pkgNameInput.value = s || 'package';
        }

        if (!pkgVersionInput.value.trim()) {
          const d = new Date();
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          const day = String(d.getDate()).padStart(2, '0');
          pkgVersionInput.value = `${y}.${m}.${day}`;
        }
      }

      // ---------- 处理文件（核心：排序倒序） ----------
      function handleFiles(fileListLike) {
        if (isUploading) {
          setStatus('正在上传中，请稍候...', 'info', '⏳');
          return;
        }

        const arr = Array.from(fileListLike);
        const files = [];
        let detectedFolder = '';

        for (const file of arr) {
          const rp = file.webkitRelativePath || file.name;
          const n = rp.replace(/\\/g, '/');
          const parts = n.split('/').filter(p => p.length > 0);

          if (!detectedFolder && parts.length >= 1) {
            detectedFolder = parts[0];
          }

          // 根目录：parts.length === 2
          if (parts.length !== 2) continue;

          const baseName = parts[1];
          if (!isTarget(baseName)) continue;

          files.push({
            file,
            baseName,
            dirName: parts[0],
          });
        }

        if (files.length === 0) {
          setStatus('根目录下未找到 .EXE 或 .OBJ 文件', 'error', '🔍');
          allFiles = [];
          folderName = '';
          renderFileList();
          return;
        }

        // ★ 按字典序倒序排序（按文件名）
        files.sort(compareDesc);

        allFiles = files;
        folderName = detectedFolder;
        renderFileList();
        applyDefaults();
        clearStatus();
        setStatus(`文件夹「${folderName}」根目录找到 ${allFiles.length} 个文件，已按文件名倒序排列`, 'success', '✅');
      }

      // ---------- 上传 ----------
      async function uploadAll() {
        if (allFiles.length === 0) {
          setStatus('没有可上传的文件', 'error', '📂');
          return;
        }

        const token = tokenInput.value.trim();
        if (!token) {
          setStatus('请填写 GITLAB_TOKEN', 'error', '🔑');
          return;
        }

        let baseUrl = gitlabUrlInput.value.trim().replace(/\/+$/, '');
        if (!baseUrl) {
          setStatus('GitLab 地址不能为空', 'error', '🌐');
          return;
        }

        const projectId = projectIdInput.value.trim();
        if (!projectId) {
          setStatus('项目 ID 不能为空', 'error', '🆔');
          return;
        }

        let pkgName = sanitizePkgName(pkgNameInput.value.trim());
        if (!pkgName) {
          setStatus('包名不能为空（净化后）', 'error', '📦');
          return;
        }

        const pkgVersion = pkgVersionInput.value.trim();
        if (!pkgVersion) {
          setStatus('版本号不能为空', 'error', '📅');
          return;
        }

        isUploading = true;
        uploadBtn.disabled = true;
        uploadBtn.innerHTML = '<span class="spin"></span> 上传中...';
        progressPanel.classList.add('visible');
        progressFill.style.width = '0%';

        const total = allFiles.length;
        let ok = 0, fail = 0;
        const errors = [];

        // 因为 allFiles 已经排序为倒序，直接顺序遍历即为倒序上传
        for (let i = 0; i < total; i++) {
          const item = allFiles[i];
          const { file, baseName, dirName } = item;

          let remoteName = isAllCaps(baseName)
            ? dirName.toUpperCase() + '_' + baseName
            : dirName + '_' + baseName;

          const url = `${baseUrl}/api/v4/projects/${projectId}/packages/generic/${encodeURIComponent(pkgName)}/${encodeURIComponent(pkgVersion)}/${encodeURIComponent(remoteName)}`;

          progressFill.style.width = `${(i / total) * 100}%`;
          progressText.textContent = `${i} / ${total}  (${baseName})`;

          try {
            const res = await fetch(url, {
              method: 'PUT',
              headers: { 'PRIVATE-TOKEN': token },
              body: file,
            });

            if (res.status === 201) {
              ok++;
            } else {
              fail++;
              const t = await res.text().catch(() => '');
              errors.push(`${baseName}: HTTP ${res.status}${t ? ' - ' + t.slice(0, 120) : ''}`);
            }
          } catch (e) {
            fail++;
            errors.push(`${baseName}: ${e.message}`);
          }

          progressFill.style.width = `${((i + 1) / total) * 100}%`;
          progressText.textContent = `${i + 1} / ${total}  (${baseName})`;
        }

        isUploading = false;
        uploadBtn.disabled = false;
        uploadBtn.innerHTML = '<span>🚀</span> 上传全部（倒序）';
        updateUploadBtn();

        if (fail === 0) {
          setStatus(`全部上传成功，共 ${ok} 个文件（倒序）`, 'success', '🎉');
        } else {
          const d = errors.slice(0, 3).join('; ') + (errors.length > 3 ? '...' : '');
          setStatus(`上传完成：成功 ${ok}，失败 ${fail}。${d}`, 'error', '⚠️');
        }

        setTimeout(() => progressPanel.classList.remove('visible'), 3000);
      }

      function updateUploadBtn() {
        const hasFiles = allFiles.length > 0;
        const hasToken = tokenInput.value.trim().length > 0;
        uploadBtn.disabled = !(hasFiles && hasToken) || isUploading;
      }

      function resetAll() {
        if (isUploading) return;
        allFiles = [];
        folderName = '';
        renderFileList();
        gitlabUrlInput.value = 'https://git.tongji.edu.cn';
        projectIdInput.value = '1607';
        pkgNameInput.value = '';
        insecureCheck.checked = false;
        const d = new Date();
        pkgVersionInput.value = `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
        clearStatus();
        progressPanel.classList.remove('visible');
        updateUploadBtn();
      }

      // ---------- 拖拽（同步获取 entry） ----------
      dropZone.addEventListener('dragover', e => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.add('dragover');
      });

      dropZone.addEventListener('dragleave', e => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.remove('dragover');
      });

      dropZone.addEventListener('drop', e => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.remove('dragover');

        if (isUploading) {
          setStatus('正在上传中，请稍候...', 'info', '⏳');
          return;
        }

        const items = e.dataTransfer.items;
        if (!items || items.length === 0) {
          setStatus('未能获取拖拽内容，请点击选择文件夹', 'error', '📁');
          return;
        }

        const entries = [];
        for (let i = 0; i < items.length; i++) {
          const entry = items[i].webkitGetAsEntry(); // 必须同步
          if (entry) entries.push(entry);
        }

        const dirEntry = entries.find(en => en.isDirectory);
        if (!dirEntry) {
          const fileEntries = entries.filter(en => en.isFile);
          if (fileEntries.length > 0) {
            setStatus('请拖入一个文件夹（而非单独文件）', 'error', '📁');
          } else {
            setStatus('未能识别拖拽内容，请点击选择文件夹', 'error', '📁');
          }
          return;
        }

        collectRootFiles(dirEntry)
          .then(files => {
            if (files.length === 0) {
              setStatus('文件夹根目录下未找到 .EXE 或 .OBJ 文件', 'error', '🔍');
              return;
            }
            handleFiles(files);
          })
          .catch(err => {
            setStatus('读取文件夹失败：' + err.message, 'error', '💥');
          });
      });

      function collectRootFiles(dirEntry) {
        return new Promise((resolve, reject) => {
          const reader = dirEntry.createReader();
          const results = [];

          const readBatch = () => {
            reader.readEntries(async (entries) => {
              if (entries.length === 0) {
                resolve(results);
                return;
              }

              for (const entry of entries) {
                if (entry.isFile) {
                  await new Promise(res => {
                    entry.file(file => {
                      const folder = dirEntry.name;
                      try {
                        Object.defineProperty(file, 'webkitRelativePath', {
                          value: `${folder}/${file.name}`,
                          writable: false,
                          configurable: true,
                        });
                      } catch (_) {}
                      results.push(file);
                      res();
                    }, () => res());
                  });
                }
              }

              readBatch();
            }, reject);
          };

          readBatch();
        });
      }

      dropZone.addEventListener('click', e => {
        if (e.target.closest('input')) return;
        folderInput.click();
      });

      selectFolderBtn.addEventListener('click', () => {
        if (isUploading) {
          setStatus('正在上传中，请稍候...', 'info', '⏳');
          return;
        }
        folderInput.click();
      });

      folderInput.addEventListener('change', e => {
        if (e.target.files.length > 0) {
          handleFiles(e.target.files);
        }
        folderInput.value = '';
      });

      uploadBtn.addEventListener('click', uploadAll);
      resetBtn.addEventListener('click', resetAll);
      tokenInput.addEventListener('input', updateUploadBtn);

      (function init() {
        const d = new Date();
        pkgVersionInput.value = `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
        updateUploadBtn();
      })();
    })();
  </script>
</body>
